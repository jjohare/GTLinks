[workspace]
resolver = "3"
members = ["crates/gtlinks-sim", "crates/gtlinks-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/jjohare/GTLinks"

[workspace.dependencies]
libm = "0.2.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned exactly: the generated glue must match the installed wasm-bindgen CLI (0.2.129).
wasm-bindgen = "=0.2.129"
gtlinks-sim = { path = "crates/gtlinks-sim" }

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
string_add = "warn"
wildcard_imports = "warn"
allow_attributes_without_reason = "warn"

# The property suite runs tens of thousands of simulated minutes; tests are built optimised.
[profile.test]
opt-level = 3

[profile.dev.package.gtlinks-sim]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"

# Used by scripts/build-wasm.sh: small, aborting, whole-program optimised.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
